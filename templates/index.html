<!DOCTYPE html>
<html>
<head>
    <title>Project 51</title>
</head>

<body>

    <h1>Project 51 - Python + MySQL</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <button type="submit">Save</button>

    </form>

    <h2>Users</h2>

    <ul>
        {% for user in users %}
            <li>ID: {{ user[0] }} - Name: {{ user[1] }}</li>
        {% endfor %}
    </ul>

</body>
</html>
